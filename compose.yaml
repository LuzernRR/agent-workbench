services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agent-workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_workbench
      POSTGRES_USER: workbench
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d agent_workbench"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agent-workbench-postgres:/var/lib/postgresql/data

volumes:
  agent-workbench-postgres:
