[project]
name = "search-agent"
version = "0.1.0"
description = "万能搜索 Agent 的 Python 运行时：LangGraph 编排、搜索、抓取、RAG 与证据核验"
readme = "README.md"
requires-python = ">=3.12"

# 常驻核心：编排、模型、数据、静态抓取快路径。
# 这些是任何运行形态都需要的最小集合，镜像必须携带。
dependencies = [
    "langgraph>=1.2.9",
    "langchain-core>=1.5.1",
    "langgraph-checkpoint-postgres>=3.1.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.28.1",
    "trafilatura>=1.12.0",
    "selectolax>=0.3.21",
    "feedparser>=6.0.11",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "langchain-openai>=1.4.1",
    "pymilvus>=2.6.0,<3.0.0",
]

[dependency-groups]
# 动态抓取：仅在静态提取不足时升级。Chromium 体积大，
# 单独成组，API-only 镜像不安装本组，避免背上浏览器依赖。
crawler = [
    "crawl4ai>=0.4.0",
    "playwright>=1.60.0",
]

# 搜索 Provider SDK：需要各自 API Key 才能真正返回结果。
# 先声明、暂不安装，Key 准备好后再 `uv sync --group search`。
search = [
    "tavily-python>=0.5.0",
    "exa-py>=1.8.0",
]

# 向量与重排：BGE-M3 会拉入 torch，体积极大。
# 单独成组，仅 embedding/rerank worker 镜像安装。
embedding = [
    "sentence-transformers>=3.3.0",
    "FlagEmbedding>=1.3.0",
]

# 开发与测试。
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
# 默认只同步核心 + 开发组；抓取/搜索/embedding 按需显式启用。
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
